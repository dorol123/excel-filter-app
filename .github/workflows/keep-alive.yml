name: Keep-alive

# Respaldo secundario: el que realmente evita que Render duerma el servicio
# es el self-ping del propio server.js (ver ahí el comentario). GitHub
# demora los schedule de repos con poca actividad varias horas, así que
# este cron cada 10 minutos NO es confiable solo — pero no está de más
# dejarlo por si el proceso se cae por otro motivo.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir /healthz para mantener el servicio despierto
        run: |
          code=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code}" https://acreditacionesviale.onrender.com/healthz)
          echo "healthz respondió $code"
          if [ "$code" != "200" ]; then
            echo "::warning::/healthz no respondió 200 (respondió $code) — el servicio puede estar arrancando en frío, no falla el job por esto."
          fi
