<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análisis de Carteras</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="beta-gate.js" data-clave="000" data-id="analisis-carteras"></script>
  <div class="pagina-herramienta">
  <a href="index.html" class="link-volver">← Menú</a>
  <div class="contenedor" id="contenedor">
  <main class="card" id="tarjeta-carga">
    <div class="encabezado">
      <span class="icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12V3.5a8.5 8.5 0 1 1-8.5 8.5H12z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <path d="M12 12L4.5 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
        </svg>
      </span>
      <div>
        <h1>Análisis de Carteras<span class="badge-beta">Beta</span></h1>
        <p class="subtitulo">
          Subí el resumen de cuenta en PDF y armá la distribución por tipo de activos, lista
          para revisar o exportar a Excel.
        </p>
        <p class="nota-privacidad">
          Todo el procesamiento ocurre en tu navegador: el PDF nunca se sube a ningún
          servidor.
        </p>
      </div>
    </div>

    <label class="dropzone" id="dropzone" for="archivo">
      <span id="texto-dropzone">Arrastrá el resumen de cuenta (.pdf) acá o hacé click para elegirlo</span>
    </label>
    <input type="file" id="archivo" name="archivo" accept=".pdf" hidden />

    <p id="mensaje" class="mensaje" role="status"></p>
  </main>

  <section id="resultado" class="preview-card preview-card-ancho oculto">
    <div class="preview-header">
      <h2 id="titulo-cartera">Cartera</h2>
      <p class="nota-atajo" id="info-cartera"></p>
    </div>

    <div class="toolbar-derecha">
      <div class="exportar-menu" id="exportar-menu">
        <button type="button" id="btn-exportar" class="btn-primario">Exportar a Excel ▾</button>
        <div class="exportar-panel oculto" id="exportar-panel">
          <p class="exportar-panel-titulo">Categorías a incluir</p>
          <div class="exportar-panel-checks" id="exportar-checks"></div>
          <button type="button" id="btn-exportar-confirmar" class="btn-primario">Descargar</button>
        </div>
      </div>
    </div>
    <p id="exportar-mensaje" class="mensaje"></p>

    <div class="analisis-cuerpo" id="cuerpo-analisis">
      <div class="analisis-columna-tablas" id="columna-tablas"></div>
      <div class="analisis-columna-torta" id="columna-torta"></div>
    </div>
  </section>
  </div>
  </div>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="analisis-carteras-motor.js"></script>
  <script src="analisis-carteras.js"></script>
</body>
</html>
